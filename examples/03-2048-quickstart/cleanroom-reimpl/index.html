<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>2048 Clean-Room Reimplementation</title>
<style>
/* Clean-room CSS built strictly from 11-ui-implementation.md tokens */
body { margin: 0; background: #faf8ef; color: #776e65; font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif; }
.container { width: 500px; margin: 36px auto; }
.heading { display: flex; justify-content: space-between; align-items: center; }
h1 { margin: 0; font-size: 74px; font-weight: 700; line-height: 1; }
.scores { display: flex; gap: 6px; }
.score-box { background: #bbada0; color: #fff; border-radius: 3px; padding: 8px 20px; text-align: center; min-width: 70px; }
.score-box .lbl { font-size: 12px; color: #eee4da; text-transform: uppercase; font-weight: 700; }
.score-box .val { font-size: 24px; font-weight: 700; line-height: 1.1; }
.above { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 24px; font-size: 17px; }
.new-btn { background: #8f7a66; color: #f9f6f2; border: 0; border-radius: 3px; padding: 10px 20px; font-size: 16px; font-weight: 700; }
.board { position: relative; width: 500px; height: 500px; box-sizing: border-box; background: #bbada0; border-radius: 6px; padding: 15px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 15px; }
.cell { background: rgba(238, 228, 218, 0.35); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 55px; }
.t-2 { background: #eee4da; color: #776e65; }
.t-2048 { background: #edc22e; color: #f9f6f2; font-size: 36px; box-shadow: 0 0 24px rgba(243, 215, 116, 0.55); }
.overlay { position: absolute; inset: 0; background: rgba(237, 194, 46, 0.5); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.overlay p { font-size: 60px; font-weight: 700; color: #f9f6f2; margin: 0 0 24px; }
.overlay .acts { display: flex; gap: 10px; }
.overlay button { background: #8f7a66; color: #f9f6f2; border: 0; border-radius: 3px; padding: 10px 20px; font-size: 16px; font-weight: 700; }
.foot { margin-top: 24px; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
<div class="container">
  <div class="heading">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="lbl">SCORE</div><div class="val" id="sc">2048</div></div>
      <div class="score-box"><div class="lbl">BEST</div><div class="val" id="bs">2048</div></div>
    </div>
  </div>
  <div class="above">
    <div>Join the numbers and get to the <strong>2048 tile!</strong></div>
    <button class="new-btn">New Game</button>
  </div>
  <div class="board" id="board">
    <div class="cell t-2048">2048</div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell t-2">2</div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="overlay" id="ov">
      <p>You win!</p>
      <div class="acts"><button>Keep going</button><button>Try again</button></div>
    </div>
  </div>
  <div class="foot"><strong>HOW TO PLAY:</strong> Use your <strong>arrow keys</strong> to move the tiles. When two tiles with the same number touch, they <strong>merge into one!</strong></div>
</div>
</body>
</html>
